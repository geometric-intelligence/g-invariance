# Misc and system settings
name: 'g-invariance'
dataset_dir: '/tmp/datasets/'
seed: 42
checkpoint_dir: "checkpoints/"
checkpoint_name_pattern: 'g-invariance-{epoch:03d}'
log_every_n_steps: 1
progress_bar: true

# Data
data_augmentation: 'so2'
augmentation_factor: 1
img_size: 32

# Training
batch_size: 128
gpu_count: 1
num_workers: 8
lr: 0.001
max_epochs: 10

# Model specs
model_name: 'GInvNet'
# model_name: 'VanillaNet'
N: 8
pooling: 'tc'
group: 'dihedral'
dataset_name: 'CIFAR10'
n_input_channels: 3
n_filters: 20
# first fc size is auto determined
# from target param count
target_params_count: 1000000
fc_sizes: [64, 64, 10]