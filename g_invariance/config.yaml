# Misc and system settings
name: 'g-invariance'
dataset_dir: '/tmp/datasets/'
seed: 42
checkpoint_dir: "checkpoints/"
checkpoint_name_pattern: 'g-invariance-{epoch:03d}'
log_every_n_steps: 1
progress_bar: true

# Data
data_augmentation: 'so2'
augmentation_factor: 2
img_size: 46

# Training
batch_size: 64
gpu_count: 1
num_workers: 8
lr: 0.001
max_epochs: 10

# Model specs
model_name: 'GInvNet' # ConvNet, VanillaNet
N: 16
pooling: 'tc'
group: 'dihedral'
dataset_name: 'CIFAR10'
n_input_channels: 3
n_filters: 64
circle_crop: true
# first fc size is auto determined
# from target param count
target_params_count: 400000
fc_sizes: [64, 64, 10]
