name: 'mnist'
seed: 42
lr: 0.001
checkpoint_dir: "checkpoints/"
checkpoint_name_pattern: 'mnist-{epoch:03d}'
log_every_n_steps: 10
max_epochs: 5
progress_bar: true

# Training
batch_size: 512
gpu_count: 1
num_workers: 8
N: 8
pooling: 'tc'
group: 'cyclic'
dataset_name: 'EMNIST'
augmentation_factor: 2
dataset_dir: '/tmp/datasets/'
n_channels: 4
fc_sizes: [64, 64, 64, 26]
data_augmentation: 'so2'