# Misc and system settings
name: "g-invariance-cifar10-search"
dataset_dir: "/home/ubuntu/datasets/"
seed: 42
checkpoint_dir: "checkpoints/"
checkpoint_name_pattern: "g-invariance-{epoch:03d}"
log_every_n_steps: 1
progress_bar: true

# Data
data_augmentation: "o2"
augmentation_factor: 8
img_size: 32

# Training
batch_size: 128
gpu_count: 1
num_workers: 8
lr: 0.001
max_epochs: 50

# Model specs
model_name: "GInvNet" # CIFAR10Model, ConvNet, VanillaNet
# dimension is currently hardcoded in BSP
N: 8
pooling: "bsp"
group: "dihedral"
dataset_name: "CIFAR10"
n_input_channels: 3
n_filters: 16
circle_crop: false
# first fc size is auto determined
# from target param count
target_params_count: 1000000
fc_sizes: [64, 64, 10]
dropout_rate: 0.2
