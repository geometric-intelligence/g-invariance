name: 'mnist'
seed: 42
layer_1_size: 128
layer_2_size: 256
layer_3_size: 256
lr: 0.001
checkpoint_dir: "checkpoints/"
checkpoint_name_pattern: 'mnist-{epoch:03d}'
log_every_n_steps: 10
max_epochs: 5
warmup_epochs: 20
progress_bar: true

# Training
batch_size: 64
gpu_count: 1
workers: 10
transform: 'O2'
num_workers: 8
N: 8
pooling: 'tc'
group_type: 'dihedral'
out_dim: 544
dataset: 'mnist'
continuous_group: 'O2'
augmentation_factor: 2
dataset_dir: '/tmp/datasets/'